name: Home Assistant

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

